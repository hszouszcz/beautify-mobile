name: test

# Lint + typecheck + Jest (with the 80% coverage gate) on every push/PR.
# Runs on ubuntu-latest only (1× billing) — well within the free tier. Maestro
# E2E is intentionally NOT here: it needs a device/emulator and the macOS runner
# is billed 10×. Run it locally (npm run test:e2e) or via Maestro Cloud.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage gate
        run: npm run test:coverage -- --ci --maxWorkers=2
